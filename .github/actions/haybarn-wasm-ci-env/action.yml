# Haybarn shared wasm build environment.
#
# Runs the caller's `script:` inside the same image that
# haybarn-extension-ci-tools / haybarn-community-extensions use to
# compile community .duckdb_extension.wasm artifacts:
#
#   ghcr.io/query-farm-haybarn/haybarn-wasm-base:v1.5.2
#
# The image bakes Ubuntu 24.04 + emsdk at /emsdk + ccache 4.13.6
# (musl-static, HTTP bearer-auth works) + sccache + vcpkg. PATH
# already includes /emsdk and /emsdk/upstream/emscripten, so emcc /
# em++ / node / npm are available without sourcing emsdk_env.sh.
#
# Design rules:
#   * One `docker run`. No shell wrapping around the user's script.
#   * No bootstrap commands prepended — the caller's script is the
#     only thing inside `bash -c "..."`. If the caller wants
#     `set -euxo pipefail` or yarn or wabt, they declare it in
#     their own script.
#   * Forwarded env vars are just the ones the build actually reads:
#     CCACHE_REMOTE_STORAGE, SCCACHE_*, CARGO_INCREMENTAL.
#     RUSTC_WRAPPER=sccache is set inside the container only (not
#     leaked to the runner host, where sccache isn't installed).
#   * `--init` so signals (SIGTERM from a job cancel) propagate to
#     ninja child processes instead of leaving in-flight compile jobs
#     orphaned.

name: 'Haybarn wasm CI env'
description: 'Run a script inside the Haybarn shared wasm build image.'

inputs:
  script:
    description: 'Script to execute inside the container'
    required: true
  image:
    description: 'Container image reference'
    required: false
    default: 'ghcr.io/query-farm-haybarn/haybarn-wasm-base:v1.5.2'

runs:
  using: 'composite'
  steps:
    - name: Pull container image
      shell: bash
      run: docker pull "${{ inputs.image }}"

    - name: Fix workspace permissions (pre)
      shell: bash
      run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}"

    - name: Run script in container
      shell: bash
      env:
        SCRIPT: ${{ inputs.script }}
      run: |
        docker run --rm --init \
          -v "${{ github.workspace }}:/github/workspace/:delegated" \
          -w /github/workspace \
          -e EM_CACHE=/github/workspace/.emscripten_cache \
          -e YARN_CACHE_FOLDER=/github/workspace/.yarn_cache \
          -e CARGO_HOME=/github/workspace/.cargo \
          -e CCACHE_DIR=/github/workspace/.ccache \
          -e CCACHE_BASEDIR=/github/workspace \
          -e CCACHE_REMOTE_STORAGE \
          -e SCCACHE_WEBDAV_ENDPOINT \
          -e SCCACHE_WEBDAV_TOKEN \
          -e RUSTC_WRAPPER=sccache \
          -e CARGO_INCREMENTAL \
          -e SCRIPT \
          "${{ inputs.image }}" \
          bash -c 'eval "$SCRIPT"'

    - name: Fix workspace permissions (post)
      shell: bash
      if: always()
      run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}"
