                  script: |-
                      git config --global --add safe.directory '*'
                      mkdir -p ./lib/build/wasm/release ./reports
                      yarn install --frozen-lockfile
                      ./scripts/generate_tpch_tbl.sh 0.01
                      ./scripts/generate_tpch_arrow.sh 0.01
                      ./scripts/generate_tpch_duckdb.sh 0.01
                      ./scripts/generate_tpch_sqlite.sh 0.01
                      ./scripts/generate_uni.sh
                      ./scripts/npm_version.sh

            - name: Build @haybarn/haybarn-wasm
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm/dist/
                      yarn workspace @haybarn/haybarn-wasm build:release
                      yarn workspace @haybarn/haybarn-wasm docs

            - name: Build @haybarn/haybarn-wasm-shell
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm-shell/dist/
                      yarn workspace @haybarn/haybarn-wasm-shell install:wasmpack
                      yarn workspace @haybarn/haybarn-wasm-shell build:release

            - name: Build @haybarn/haybarn-wasm-app
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm-app/build/
                      yarn workspace @haybarn/haybarn-wasm-app build:release

            #- name: Coverage @haybarn/haybarn-wasm
            #  shell: bash
            #  run: |
            #           CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:coverage

            - name: Package
              shell: bash
              run: zip -r duckdb-wasm-packages.zip ./packages

            - name: Measure NPM stats
              run: |
                  ./scripts/npm_measure_lib.sh

            - name: Test @haybarn/haybarn-wasm on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome
            
            #            - name: Test @haybarn/haybarn-wasm on Firefox
            #              uses: ./.github/actions/haybarn-wasm-ci-env
            #              with:
            #                  script: |-
            #                      yarn workspace @haybarn/haybarn-wasm test:firefox

            - name: Test @haybarn/haybarn-wasm on Node.js
              shell: bash
              run: |
                      yarn workspace @haybarn/haybarn-wasm test:node

            # Publish the threads wasm to Haybarn R2 (served at haybarn-extensions.query.farm) under a
            # version-pinned key; the shell's _worker.js streams it same-origin from there. The version
            # comes from the worker's own URL, the single source of truth for the path it requests.
            - name: Publish threads wasm to R2
              if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/haybarn-v2.')
              env:
                  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
                  AWS_DEFAULT_REGION: auto
                  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
                  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
              run: |
                  VERSION=$(grep -oE 'engine/[^/]+/duckdb-threads\.wasm' packages/duckdb-wasm-app/_worker.js | head -1 | sed -E 's|engine/(.+)/duckdb-threads\.wasm|\1|')
                  test -n "$VERSION" || { echo "could not parse engine version from _worker.js"; exit 1; }
                  WASM=./packages/duckdb-wasm/src/bindings/duckdb-threads.wasm
                  test -f "$WASM" || { echo "missing $WASM"; exit 1; }
                  echo "Uploading $WASM -> s3://${{ secrets.R2_BUCKET }}/engine/${VERSION}/duckdb-threads.wasm"
                  aws s3 cp "$WASM" "s3://${{ secrets.R2_BUCKET }}/engine/${VERSION}/duckdb-threads.wasm" \
                      --content-type application/wasm \
                      --cache-control "public, max-age=31536000, immutable"

            # Release candidates (haybarn-v2.0.0-rcN) are published under the npm dist-tag `rc` and deploy
            # the shell as a Cloudflare Pages preview; `latest` and the production shell stay with the 1.5
            # line until a stable 2.0 tag.
            - name: Release channel
              id: channel
              if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/haybarn-v2.')
              run: |
                  if [[ "${GITHUB_REF_NAME}" == *-rc* ]]; then
                      echo "npm_tag=rc" >> "$GITHUB_OUTPUT"
                      echo "pages_branch=haybarn-2-0-rc" >> "$GITHUB_OUTPUT"
                  else
                      echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
                      echo "pages_branch=production" >> "$GITHUB_OUTPUT"
                  fi

            # Publish @haybarn/haybarn-wasm with the org-level HAYBARN_NPM_TOKEN (provenance comes from
            # the job's id-token permission). The other workspace packages are private and never published.
            - name: Publish @haybarn/haybarn-wasm to npm
              env:
                  TAG: ${{ steps.channel.outputs.npm_tag }}
                  NODE_AUTH_TOKEN: ${{ secrets.HAYBARN_NPM_TOKEN }}
              if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/haybarn-v2.')
              run: |
                  echo "TAG=${TAG} ref=${GITHUB_REF}"
                  test -n "${TAG}"
                  ./scripts/npm_publish_lib.sh

            # Deploy the Haybarn shell to Cloudflare Pages, after the npm publish: the shell loads the base
            # wasm from the published package. An rc goes to the preview branch alias
            # (https://haybarn-2-0-rc.haybarn-shell.pages.dev), a stable release to production
            # (shell.haybarn.query.farm). Pinned wrangler, and the account id is stripped of stray
            # whitespace (wrangler >= 4.119 rejects it), as on 1.5.
            - name: Deploy Haybarn shell to Cloudflare Pages
              if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/haybarn-v2.')
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '[:space:]')"
                  npx --yes wrangler@4.119.0 pages deploy \
                      packages/duckdb-wasm-app/build/release \
                      --project-name haybarn-shell \
                      --branch "${{ steps.channel.outputs.pages_branch }}"

    merge_reports:
        name: Merge benchmark reports
        runs-on: ubuntu-latest
        if: inputs.run_benchmarks
        needs:
            - js_libs
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true

            - uses: actions/download-artifact@v8
              with:
                  name: dataprep
                  path: ./target/release/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_micro
                  path: ./reports/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_tpch_0_01
                  path: ./reports/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_tpch_0_1
                  path: ./reports/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_tpch_0_25
                  path: ./reports/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_tpch_0_5
                  path: ./reports/

            - name: Merge reports
              shell: bash
              run: |
                mkdir duckdb
                cd duckdb
                wget https://github.com/duckdb/duckdb/releases/download/v0.8.1/duckdb_cli-linux-amd64.zip
                unzip duckdb_cli-linux-amd64.zip
                ./duckdb -c "COPY (FROM read_json_auto('../reports/*.json', union_by_name=1)) TO 'benchmarks.json'"
                ./duckdb -c "COPY (FROM read_json_auto('../reports/*.json', union_by_name=1)) TO 'benchmarks.csv'"

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: reports_various
                  path: |
                      ./reports/benchmarks.arrow
                      ./duckdb/benchmarks.json
                      ./duckdb/benchmarks.csv
                  retention-days: 1

            - name: Merge benchmark reports
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      chmod +x ./target/release/dataprep
                      ./target/release/dataprep merge-benchmarks -r ./reports/

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: reports_all
                  path: |
                      ./reports/benchmarks.arrow
                  retention-days: 1

            # Haybarn: no gh-pages branch, so the reports are only uploaded as artifacts.
            - name: Deploy benchmark reports
              if: false
              run: |
                  git config --global user.name 'github-actions[bot]'
                  git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
                  git fetch origin gh-pages
                  ./scripts/deploy_benchmarks.sh
