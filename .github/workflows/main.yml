name: 'Main'
on:
    push:
    pull_request:
    create:
        tags:
            - haybarn-v*
    workflow_call:
      inputs:
        override_git_describe:
          type: string
        git_ref:
          type: string
        skip_tests:
          type: string
        # Haybarn: opt-in to the benchmark suite (TPCH 0.01/0.1/0.25/0.5
        # + microbenchmarks + merge_reports). Default off — the suite
        # takes ~30 min per run and we've already established that the
        # numbers track upstream within the noise. Set to true via
        # workflow_dispatch when chasing a perf regression.
        run_benchmarks:
          type: boolean
          default: false
    workflow_dispatch:
      inputs:
        override_git_describe:
          type: string
        git_ref:
          type: string
        skip_tests:
          type: string
        run_benchmarks:
          description: 'Run the TPCH + microbenchmark suite (~30 min). Default off.'
          type: boolean
          default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/haybarn' || github.sha }}-${{ github.event_name}}
  cancel-in-progress: true

env:
  EMSCRIPTEN_VERSION: '5.0.7'
  EMSCRIPTEN_VERSION_COI: '5.0.7'
  DEFAULT_USE_GENERATED_EXPORTED_LIST: 'no'
  # Placeholder npm token. `actions/setup-node` with `registry-url:` writes
  # an .npmrc (pointed at by NPM_CONFIG_USERCONFIG) containing a literal
  # `${NODE_AUTH_TOKEN}`, and yarn 1.x hard-errors with "Failed to replace
  # env in config" if that variable is unset — even for a plain
  # `yarn install` that never authenticates.
  #
  # setup-node v6 papered over this by exporting a dummy NODE_AUTH_TOKEN
  # itself; v7 stopped, which is what broke every Js / Libraries job on the
  # v7 bump. Exporting our own placeholder restores v6's behaviour without
  # putting the real token in every step's environment — the publish step
  # sets the genuine HAYBARN_NPM_TOKEN at step level, which takes
  # precedence over this.
  NODE_AUTH_TOKEN: 'XXXXX-XXXXX-XXXXX-XXXXX'
  # R2-backed ccache shared with haybarn-extension-ci-tools — same
  # Cloudflare Worker, same bucket, same bearer-token-auth scheme.
  # Survives across runs, branches, and the duckdb-wasm <-> extensions
  # repo boundary. Hot reuse: extension wasm builds populate the same
  # hashes that the engine build needs.
  #
  # The composite action `.github/actions/haybarn-wasm-ci-env` forwards
  # this var into the container; runner-level steps see it but they
  # don't invoke ccache directly so it's a harmless export.
  CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
  # sccache for the Rust shell crate (packages/duckdb-wasm-shell/crate),
  # which compiles inside the container.
  # RUSTC_WRAPPER is intentionally NOT exported at the workflow level —
  # it would force runner-level cargo (e.g. the Dataprep job's tpch-gen
  # build) to invoke `sccache rustc`, and the runner doesn't have an
  # sccache binary on PATH. The composite action passes RUSTC_WRAPPER
  # explicitly inside the container where sccache IS available, so the
  # behavior splits cleanly: containerized Rust → cached; runner Rust →
  # uncached but functional.
  SCCACHE_WEBDAV_ENDPOINT: "https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/sccache/"
  SCCACHE_WEBDAV_TOKEN: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
  CARGO_INCREMENTAL: 0

jobs:
    # Clang-Format job removed: it lints lib/* C++ which we intentionally
    # carry verbatim from upstream duckdb-wasm. Any formatting deviation
    # is upstream-side, not ours. The shared haybarn-wasm-base image
    # also doesn't ship clang-format. Re-enable in a future rev if
    # Haybarn-specific C++ ever lands in lib/.
    eslint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'

            - name: Test VGI shared-memory host ABI
              run: |
                  node lib/vgi-sab-ring.test.js
                  node lib/vgi-sab-publication.test.js

            - name: Cache node_modules
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./packages/benchmarks/node_modules
                      ./packages/duckdb-wasm/node_modules
                      ./packages/duckdb-wasm-shell/node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('./yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Prepare repository
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      yarn install --frozen-lockfile --prefer-offline

            - name: Lint @haybarn/haybarn-wasm
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      yarn workspace @haybarn/haybarn-wasm run lint

            - name: Lint @haybarn/haybarn-wasm-shell
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      yarn workspace @haybarn/haybarn-wasm-shell run lint

            - name: Lint @haybarn/benchmarks
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      yarn workspace @haybarn/benchmarks run lint

    tpchgen:
        name: TPCH Generator
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'

            - name: Cache generator
              uses: actions/cache@v6
              id: cache-generator
              with:
                  path: ./submodules/tpch-dbgen/dbgen/dbgen
                  key: ${{ runner.os }}-tpch-dbgen

            - name: Build generator
              if: steps.cache-generator.outputs.cache-hit != 'true'
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      make -C ./submodules/tpch-dbgen/dbgen/ dbgen

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: tpch-dbgen
                  path: |
                      ./submodules/tpch-dbgen/dbgen/dbgen
                  retention-days: 1

    dataprep:
        name: Dataprep
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'

            - name: Cache rust build
              uses: actions/cache@v6
              with:
                  path: |
                      ./.cargo/bin/
                      ./.cargo/registry/index/
                      ./.cargo/registry/cache/
                      ./.cargo/git/db/
                      ./target
                  key: ${{ runner.os }}-dataprep-${{ hashFiles('./Cargo.lock') }}-${{ hashFiles('./tools/dataprep/src/*.rs') }}
                  restore-keys: |
                      ${{ runner.os }}-dataprep-

            - name: Build generator
              shell: bash
              run: |
                      cargo build --manifest-path=./Cargo.toml --release -p dataprep

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dataprep
                  path: |
                      ./target/release/dataprep
                  retention-days: 1

    wasm_mvp:
        name: Wasm / mvp
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            # Install emsdk at the fixed path /opt/emsdk. mymindstorm/setup-emsdk
            # installs to a per-run UUID-named temp dir, which gets hashed into
            # every ccache compile entry and defeats cross-run cache reuse.
            # A fixed install path keeps ccache keys stable across runs.
            - name: Cache /opt/emsdk
              id: cache-emsdk
              uses: actions/cache@v6
              with:
                  path: /opt/emsdk
                  key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-x86_64-linux
            - name: Install emsdk at /opt/emsdk
              if: steps.cache-emsdk.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euxo pipefail
                  sudo mkdir -p /opt && sudo chown -R "$(id -u):$(id -g)" /opt
                  git clone --depth=1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
                  cd /opt/emsdk
                  ./emsdk install ${{ env.EMSCRIPTEN_VERSION }}
                  ./emsdk activate ${{ env.EMSCRIPTEN_VERSION }}
            - name: Activate emsdk on PATH
              shell: bash
              run: |
                  set -exo pipefail   # NOT -u: emsdk_env.sh doesn't always set every var
                  source /opt/emsdk/emsdk_env.sh
                  echo "EMSDK=${EMSDK:-/opt/emsdk}" >> "$GITHUB_ENV"
                  echo "EMSDK_NODE=${EMSDK_NODE:-}" >> "$GITHUB_ENV"
                  echo "EM_CONFIG=${EM_CONFIG:-/opt/emsdk/.emscripten}" >> "$GITHUB_ENV"
                  echo "/opt/emsdk"                       >> "$GITHUB_PATH"
                  echo "/opt/emsdk/upstream/emscripten"   >> "$GITHUB_PATH"
                  if [ -n "${EMSDK_NODE:-}" ]; then echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"; fi

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  DUCKDB_WASM_VERSION="v1.5.5" DUCKDB_PLATFORM="wasm_mvp" ./scripts/wasm_build_lib.sh relperf mvp

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-mvp
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-mvp.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-mvp.wasm
                  retention-days: 1

    wasm_eh:
        name: Wasm / eh
        runs-on: ubuntu-latest
