            - name: Package
              shell: bash
              run: zip -r duckdb-wasm-packages.zip ./packages

            - uses: actions/upload-artifact@v7
              with:
                  name: duckdb-wasm-packages-loadable
                  path: duckdb-wasm-packages.zip

            - name: Measure NPM stats
              run: |
                  ./scripts/npm_measure_lib.sh

            - name: Test @haybarn/haybarn-wasm on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome

            - name: Test loadable threaded bundle on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:threads:smoke

            # Haybarn: httpfs from the local repository on both bundles: remote reads, secrets, S3 through the
            # browser HTTP client
            - name: Test HTTPFS on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:httpfs

            # Haybarn: interrupting a running query, its HTTP requests and reading its progress, on both bundles
            - name: Test query interrupt and progress on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:interrupt

            # Haybarn: the platform functions for extensions (OAuth popup, page origin, Web Crypto, SHA-256, the VGI
            # worker: transport) through the test extension, called from the engine's threads, on both bundles
            - name: Test platform functions for extensions on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:platform

            # Haybarn: prefetch, hash and compile extensions ahead of LOAD, signatures on: the local extensions
            # signed with a throwaway key the test server makes, and the published Haybarn repository
            - name: Test extension prefetch on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:prefetch

            # Haybarn: install and load signed core extensions from haybarn-extensions.query.farm with
            # both loadable bundles, the way a user's page does (no local repository, signatures checked)
            - name: Test the Haybarn extension repository on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:haybarn-repository

            # Haybarn: remote extension loads with the scheduler's threads live (20 fresh instances, no SET threads=1
            # bracket, autoloads inside queries), pthread pool exhaustion and failing parallel queries on the threads bundle
            - name: Test extension loads and the pthread pool on the threads bundle
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` POOL_ITERATIONS=20 yarn workspace @haybarn/haybarn-wasm test:chrome:threads-pool

