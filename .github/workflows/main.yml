name: 'Main'
on:
    push:
    pull_request:
    create:
        tags:
            - haybarn-v*
    workflow_call:
      inputs:
        override_git_describe:
          type: string
        git_ref:
          type: string
        skip_tests:
          type: string
    workflow_dispatch:
      inputs:
        override_git_describe:
          type: string
        git_ref:
          type: string
        skip_tests:
          type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/haybarn' || github.sha }}-${{ github.event_name}}
  cancel-in-progress: true

env:
  EMSCRIPTEN_VERSION: '3.1.71'
  EMSCRIPTEN_VERSION_COI: '3.1.57'
  DEFAULT_USE_GENERATED_EXPORTED_LIST: 'no'

jobs:
    clang_format:
        name: Clang-Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'

            - name: Lint ./lib
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      python3 ./scripts/run_clang_format.py \
                        --exclude ./lib/build \
                        --exclude ./lib/third_party \
                        -r ./lib/

    eslint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'

            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                  path: |
                      ./node_modules
                      ./packages/benchmarks/node_modules
                      ./packages/duckdb-wasm/node_modules
                      ./packages/duckdb-wasm-shell/node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('./yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Prepare repository
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      yarn install --frozen-lockfile --prefer-offline

            - name: Lint @haybarn/haybarn-wasm
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      yarn workspace @haybarn/haybarn-wasm run lint

            - name: Lint @haybarn/haybarn-wasm-shell
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      yarn workspace @haybarn/haybarn-wasm-shell run lint

            - name: Lint @haybarn/benchmarks
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      yarn workspace @haybarn/benchmarks run lint

    tpchgen:
        name: TPCH Generator
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'

            - name: Cache generator
              uses: actions/cache@v5
              id: cache-generator
              with:
                  path: ./submodules/tpch-dbgen/dbgen/dbgen
                  key: ${{ runner.os }}-tpch-dbgen

            - name: Build generator
              if: steps.cache-generator.outputs.cache-hit != 'true'
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      make -C ./submodules/tpch-dbgen/dbgen/ dbgen

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: tpch-dbgen
                  path: |
                      ./submodules/tpch-dbgen/dbgen/dbgen
                  retention-days: 1

    dataprep:
        name: Dataprep
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'

            - name: Cache rust build
              uses: actions/cache@v5
              with:
                  path: |
                      ./.cargo/bin/
                      ./.cargo/registry/index/
                      ./.cargo/registry/cache/
                      ./.cargo/git/db/
                      ./target
                  key: ${{ runner.os }}-dataprep-${{ hashFiles('./Cargo.lock') }}-${{ hashFiles('./tools/dataprep/src/*.rs') }}
                  restore-keys: |
                      ${{ runner.os }}-dataprep-

            - name: Build generator
              shell: bash
              run: |
                      cargo build --manifest-path=./Cargo.toml --release -p dataprep

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dataprep
                  path: |
                      ./target/release/dataprep
                  retention-days: 1

    wasm_mvp:
        name: Wasm / mvp
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            - uses: mymindstorm/setup-emsdk@v14
              with:
                  version: ${{ env.EMSCRIPTEN_VERSION }}

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  DUCKDB_PLATFORM="wasm_mvp" ./scripts/wasm_build_lib.sh relperf mvp

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-mvp
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-mvp.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-mvp.wasm
                  retention-days: 1

    wasm_eh:
        name: Wasm / eh
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            - uses: mymindstorm/setup-emsdk@v14
              with:
                  version: ${{ env.EMSCRIPTEN_VERSION }}

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  DUCKDB_PLATFORM="wasm_eh" ./scripts/wasm_build_lib.sh relperf eh

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-eh
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-eh.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-eh.wasm
                  retention-days: 1

    wasm_coi:
        name: Wasm / coi
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            - uses: mymindstorm/setup-emsdk@v14
              with:
                  version: ${{ env.EMSCRIPTEN_VERSION_COI }}

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  DUCKDB_PLATFORM="wasm_coi" ./scripts/wasm_build_lib.sh relperf coi

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-coi
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-coi.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-coi.pthread.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-coi.wasm
                  retention-days: 1

    wasm_mvp_loadable:
        name: Wasm / mvp (loadable version)
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - name: Install dependencies
              run: |
                  sudo apt install wabt

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            - uses: mymindstorm/setup-emsdk@v14
              with:
                  version: ${{ env.EMSCRIPTEN_VERSION }}

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  USE_GENERATED_EXPORTED_LIST="$DEFAULT_USE_GENERATED_EXPORTED_LIST" DUCKDB_PLATFORM="wasm_mvp" DUCKDB_WASM_LOADABLE_EXTENSIONS=1 GEN=ninja ./scripts/wasm_build_lib.sh relsize mvp

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-mvp-loadable
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-mvp.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-mvp.wasm
                  retention-days: 1

    wasm_eh_loadable:
        name: Wasm / eh (loadable version)
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - name: Install dependencies
              run: |
                  sudo apt install wabt

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            - uses: mymindstorm/setup-emsdk@v14
              with:
                  version: ${{ env.EMSCRIPTEN_VERSION }}

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  USE_GENERATED_EXPORTED_LIST="$DEFAULT_USE_GENERATED_EXPORTED_LIST" DUCKDB_PLATFORM="wasm_eh" DUCKDB_WASM_LOADABLE_EXTENSIONS=1 GEN=ninja ./scripts/wasm_build_lib.sh relsize eh

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-eh-loadable
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-eh.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-eh.wasm
                  retention-days: 1

    wasm_coi_loadable:
        name: Wasm / coi (loadable version)
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - name: Install dependencies
              run: |
                  sudo apt install wabt

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            - uses: mymindstorm/setup-emsdk@v14
              with:
                  version: ${{ env.EMSCRIPTEN_VERSION_COI }}

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  USE_GENERATED_EXPORTED_LIST="$DEFAULT_USE_GENERATED_EXPORTED_LIST" DUCKDB_PLATFORM="wasm_threads" DUCKDB_WASM_LOADABLE_EXTENSIONS="signed" GEN=ninja ./scripts/wasm_build_lib.sh relsize coi

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-coi-loadable
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-coi.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-coi.pthread.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-coi.wasm
                  retention-days: 1

    js_libs:
        name: Js / Libraries
        runs-on: ubuntu-latest
        needs:
            - wasm_mvp
            - wasm_eh
            - wasm_coi
            - clang_format
            - eslint
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '18.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Cache rust build
              uses: actions/cache@v5
              with:
                  path: |
                      ./.cargo/bin/
                      ./.cargo/registry/index/
                      ./.cargo/registry/cache/
                      ./.cargo/git/db/
                      ./target
                  key: ${{ runner.os }}-shell-${{ hashFiles('./Cargo.lock') }}-${{ hashFiles('./packages/duckdb-wasm-shell/crate/src/**') }}
                  restore-keys: |
                      ${{ runner.os }}-shell-

            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                  path: |
                      ./node_modules
                      ./packages/benchmarks/node_modules
                      ./packages/duckdb-wasm/node_modules
                      ./packages/duckdb-wasm-shell/node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('./yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - uses: actions/download-artifact@v8
              with:
                  name: dataprep
                  path: ./target/release/

            - uses: actions/download-artifact@v8
              with:
                  name: tpch-dbgen
                  path: ./submodules/tpch-dbgen/dbgen/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-mvp
                  path: ./packages/duckdb-wasm/src/bindings/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-eh
                  path: ./packages/duckdb-wasm/src/bindings/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-coi
                  path: ./packages/duckdb-wasm/src/bindings/

            - name: Prepare repository
              run: |
                  git fetch --tags --no-recurse-submodules -f
                  (cd ./submodules/duckdb && git fetch --all --tags)

            - name: Prepare environment
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      git config --global --add safe.directory '*'
                      mkdir -p ./lib/build/wasm/release ./reports
                      yarn install --frozen-lockfile
                      ./scripts/generate_tpch_tbl.sh 0.01
                      ./scripts/generate_tpch_arrow.sh 0.01
                      ./scripts/generate_tpch_duckdb.sh 0.01
                      ./scripts/generate_tpch_sqlite.sh 0.01
                      ./scripts/generate_uni.sh
                      ./scripts/npm_version.sh

            - name: Build @haybarn/haybarn-wasm
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm/dist/
                      yarn workspace @haybarn/haybarn-wasm build:release
                      yarn workspace @haybarn/haybarn-wasm docs

            - name: Build @haybarn/haybarn-wasm-shell
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm-shell/dist/
                      yarn workspace @haybarn/haybarn-wasm-shell install:wasmpack
                      yarn workspace @haybarn/haybarn-wasm-shell build:release

            - name: Build @haybarn/haybarn-wasm-app
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm-app/build/
                      yarn workspace @haybarn/haybarn-wasm-app build:release

            - name: Test @haybarn/haybarn-wasm on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome
            
            #            - name: Test @haybarn/haybarn-wasm on Firefox
            #              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
            #              with:
            #                  script: |-
            #                      yarn workspace @haybarn/haybarn-wasm test:firefox

            - name: Test @haybarn/haybarn-wasm on Node.js
              shell: bash
              run: |
                      yarn workspace @haybarn/haybarn-wasm test:node

            - name: Coverage @haybarn/haybarn-wasm
              shell: bash
              run: |
                       CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:coverage

            - name: Build examples
              shell: bash
              run: |
                      yarn install
                      yarn workspace @haybarn/haybarn-wasm-examples-bare-node test
                      yarn workspace @haybarn/haybarn-wasm-examples-bare-browser build
                      yarn workspace @haybarn/haybarn-wasm-examples-esbuild-node build
                      yarn workspace @haybarn/haybarn-wasm-examples-esbuild-node test
                      yarn workspace @haybarn/haybarn-wasm-examples-esbuild-browser build

            - name: Package
              shell: bash
              run: zip -r duckdb-wasm-packages.zip ./packages

            - uses: actions/upload-artifact@v7
              with:
                  name: duckdb-wasm-packages
                  path: duckdb-wasm-packages.zip

            - name: Build @haybarn/benchmarks
              shell: bash
              run: |
                rm -r packages/duckdb-wasm/node_modules/*
                yarn workspace @haybarn/benchmarks build
                yarn workspace @haybarn/benchmarks bench:system:sort:int
                yarn workspace @haybarn/benchmarks bench:system:join:2
                yarn workspace @haybarn/benchmarks bench:system:join:3
                yarn workspace @haybarn/benchmarks bench:system:regex
                yarn workspace @haybarn/benchmarks bench:system:sum:int
                yarn workspace @haybarn/benchmarks bench:system:sum:csv

            - name: Upload reports
              uses: actions/upload-artifact@v7
              with:
                  name: reports_micro
                  path: |
                      ./reports/benchmark_system_sort_int.json
                      ./reports/benchmark_system_join_2.json
                      ./reports/benchmark_system_join_3.json
                      ./reports/benchmark_system_regex.json
                      ./reports/benchmark_system_sum_csv.json
                      ./reports/benchmark_system_sum_int.json
                  retention-days: 1

            - name: Preparation TPCH 0.01
              if: github.ref == 'refs/heads/haybarn'
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      git config --global --add safe.directory '*'
                      mkdir -p ./lib/build/wasm/release ./reports
                      yarn install --frozen-lockfile
                      ./scripts/generate_tpch_tbl.sh 0.01
                      ./scripts/generate_tpch_arrow.sh 0.01
                      ./scripts/generate_tpch_duckdb.sh 0.01
                      ./scripts/generate_tpch_sqlite.sh 0.01

            - name: Benchmarks TPCH 0.01
              if: github.ref == 'refs/heads/haybarn'
              shell: bash
              run: |
                yarn workspace @haybarn/benchmarks bench:system:tpch:duckdb 0.01
                yarn workspace @haybarn/benchmarks bench:system:tpch:sqljs 0.01
                yarn workspace @haybarn/benchmarks bench:system:tpch:arquero 0.01
                yarn workspace @haybarn/benchmarks bench:system:tpch:lovefield 0.01

            - name: Upload reports TPCH 0.01
              if: github.ref == 'refs/heads/haybarn'
              uses: actions/upload-artifact@v7
              with:
                  name: reports_tpch_0_01
                  path: |
                      ./reports/benchmark_system_tpch_001_duckdb.json
                      ./reports/benchmark_system_tpch_001_sqljs.json
                      ./reports/benchmark_system_tpch_001_arquero.json
                      ./reports/benchmark_system_tpch_001_lovefield.json
                  retention-days: 1

            - name: Preparation TPCH 0.1
              if: github.ref == 'refs/heads/haybarn'
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      git config --global --add safe.directory '*'
                      mkdir -p ./lib/build/wasm/release ./reports
                      yarn install --frozen-lockfile
                      ./scripts/generate_tpch_tbl.sh 0.1
                      ./scripts/generate_tpch_arrow.sh 0.1
                      ./scripts/generate_tpch_duckdb.sh 0.1
                      ./scripts/generate_tpch_sqlite.sh 0.1

            - name: Benchmarks TPCH 0.1
              if: github.ref == 'refs/heads/haybarn'
              shell: bash
              run: |
                yarn workspace @haybarn/benchmarks bench:system:tpch:duckdb 0.1
                yarn workspace @haybarn/benchmarks bench:system:tpch:sqljs 0.1
                yarn workspace @haybarn/benchmarks bench:system:tpch:arquero 0.1
                yarn workspace @haybarn/benchmarks bench:system:tpch:lovefield 0.1

            - name: Upload reports TPCH 0.1
              if: github.ref == 'refs/heads/haybarn'
              uses: actions/upload-artifact@v7
              with:
                  name: reports_tpch_0_1
                  path: |
                      ./reports/benchmark_system_tpch_01_duckdb.json
                      ./reports/benchmark_system_tpch_01_sqljs.json
                      ./reports/benchmark_system_tpch_01_arquero.json
                      ./reports/benchmark_system_tpch_01_lovefield.json
                  retention-days: 1

            - name: Preparation TPCH 0.25
              if: github.ref == 'refs/heads/haybarn'
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      git config --global --add safe.directory '*'
                      mkdir -p ./lib/build/wasm/release ./reports
                      yarn install --frozen-lockfile
                      ./scripts/generate_tpch_tbl.sh 0.25
                      ./scripts/generate_tpch_arrow.sh 0.25
                      ./scripts/generate_tpch_duckdb.sh 0.25
                      ./scripts/generate_tpch_sqlite.sh 0.25

            - name: Benchmarks TPCH 0.25
              if: github.ref == 'refs/heads/haybarn'
              shell: bash
              run: |
                yarn workspace @haybarn/benchmarks bench:system:tpch:duckdb 0.25
                yarn workspace @haybarn/benchmarks bench:system:tpch:sqljs 0.25
                yarn workspace @haybarn/benchmarks bench:system:tpch:arquero 0.25
                yarn workspace @haybarn/benchmarks bench:system:tpch:lovefield 0.25

            - name: Upload reports TPCH 0.25
              if: github.ref == 'refs/heads/haybarn'
              uses: actions/upload-artifact@v7
              with:
                  name: reports_tpch_0_25
                  path: |
                      ./reports/benchmark_system_tpch_025_duckdb.json
                      ./reports/benchmark_system_tpch_025_sqljs.json
                      ./reports/benchmark_system_tpch_025_arquero.json
                      ./reports/benchmark_system_tpch_025_lovefield.json
                  retention-days: 1

            - name: Preparation TPCH 0.5
              if: github.ref == 'refs/heads/haybarn'
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      git config --global --add safe.directory '*'
                      mkdir -p ./lib/build/wasm/release ./reports
                      yarn install --frozen-lockfile
                      ./scripts/generate_tpch_tbl.sh 0.5
                      ./scripts/generate_tpch_arrow.sh 0.5
                      ./scripts/generate_tpch_duckdb.sh 0.5
                      ./scripts/generate_tpch_sqlite.sh 0.5

            - name: Benchmarks TPCH 0.5
              if: github.ref == 'refs/heads/haybarn'
              shell: bash
              run: |
                yarn workspace @haybarn/benchmarks bench:system:tpch:duckdb 0.5
                yarn workspace @haybarn/benchmarks bench:system:tpch:sqljs 0.5
                yarn workspace @haybarn/benchmarks bench:system:tpch:arquero 0.5
                yarn workspace @haybarn/benchmarks bench:system:tpch:lovefield 0.5

            - name: Upload reports TPCH 0.5
              if: github.ref == 'refs/heads/haybarn'
              uses: actions/upload-artifact@v7
              with:
                  name: reports_tpch_0_5
                  path: |
                      ./reports/benchmark_system_tpch_05_duckdb.json
                      ./reports/benchmark_system_tpch_05_sqljs.json
                      ./reports/benchmark_system_tpch_05_arquero.json
                      ./reports/benchmark_system_tpch_05_lovefield.json
                  retention-days: 1

    js_libs_loadable:
        name: Js / Libraries (loadable version)
        runs-on: ubuntu-latest
        needs:
            - wasm_mvp_loadable
            - wasm_eh_loadable
            - wasm_coi_loadable
            - clang_format
            - eslint
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: 'recursive'
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: '18.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Cache rust build
              uses: actions/cache@v5
              with:
                  path: |
                      ./.cargo/bin/
                      ./.cargo/registry/index/
                      ./.cargo/registry/cache/
                      ./.cargo/git/db/
                      ./target
                  key: ${{ runner.os }}-shell-${{ hashFiles('./Cargo.lock') }}-${{ hashFiles('./packages/duckdb-wasm-shell/crate/src/**') }}
                  restore-keys: |
                      ${{ runner.os }}-shell-

            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                  path: |
                      ./node_modules
                      ./packages/benchmarks/node_modules
                      ./packages/duckdb-wasm/node_modules
                      ./packages/duckdb-wasm-shell/node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('./yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - uses: actions/download-artifact@v8
              with:
                  name: dataprep
                  path: ./target/release/

            - uses: actions/download-artifact@v8
              with:
                  name: tpch-dbgen
                  path: ./submodules/tpch-dbgen/dbgen/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-mvp-loadable
                  path: ./packages/duckdb-wasm/src/bindings/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-eh-loadable
                  path: ./packages/duckdb-wasm/src/bindings/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-coi-loadable
                  path: ./packages/duckdb-wasm/src/bindings/

            - name: Prepare repository
              run: |
                  git fetch --tags --no-recurse-submodules -f
                  (cd ./submodules/duckdb && git fetch --all --tags)

            - name: Prepare environment
              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
              with:
                  script: |-
                      git config --global --add safe.directory '*'
                      mkdir -p ./lib/build/wasm/release ./reports
                      yarn install --frozen-lockfile
                      ./scripts/generate_tpch_tbl.sh 0.01
                      ./scripts/generate_tpch_arrow.sh 0.01
                      ./scripts/generate_tpch_duckdb.sh 0.01
                      ./scripts/generate_tpch_sqlite.sh 0.01
                      ./scripts/generate_uni.sh
                      ./scripts/npm_version.sh

            - name: Build @haybarn/haybarn-wasm
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm/dist/
                      yarn workspace @haybarn/haybarn-wasm build:release
                      yarn workspace @haybarn/haybarn-wasm docs

            - name: Build @haybarn/haybarn-wasm-shell
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm-shell/dist/
                      yarn workspace @haybarn/haybarn-wasm-shell install:wasmpack
                      yarn workspace @haybarn/haybarn-wasm-shell build:release

            - name: Build @haybarn/haybarn-wasm-app
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm-app/build/
                      yarn workspace @haybarn/haybarn-wasm-app build:release

            #- name: Coverage @haybarn/haybarn-wasm
            #  shell: bash
            #  run: |
            #           CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:coverage

            - name: Package
              shell: bash
              run: zip -r duckdb-wasm-packages.zip ./packages

            - uses: actions/upload-artifact@v7
              with:
                  name: duckdb-wasm-packages-loadable
                  path: duckdb-wasm-packages.zip

            - name: Measure NPM stats
              run: |
                  ./scripts/npm_measure_lib.sh

            - name: Test @haybarn/haybarn-wasm on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome
            
            #            - name: Test @haybarn/haybarn-wasm on Firefox
            #              uses: duckdb/duckdb-wasm-ci-env@f10a0954b7b2b98e8526e0f7bbcb10e614defcbd
            #              with:
            #                  script: |-
            #                      yarn workspace @haybarn/haybarn-wasm test:firefox

            - name: Test @haybarn/haybarn-wasm on Node.js
              shell: bash
              run: |
                      yarn workspace @haybarn/haybarn-wasm test:node

            # Pages deploy disabled for the initial release — we don't host
            # shell.haybarn.query.farm yet, and there's no gh-pages branch
            # bootstrapped on the repo. Re-enable by flipping `if: false`
            # back to the ref check once the gh-pages branch exists.
            - name: Deploy GitHub Page
              if: false
              run: |
                  git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
                  git fetch origin gh-pages
                  ./scripts/deploy_pages.sh

