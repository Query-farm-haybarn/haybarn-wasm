                  cd /opt/emsdk
                  ./emsdk install ${{ env.EMSCRIPTEN_VERSION_COI }}
                  ./emsdk activate ${{ env.EMSCRIPTEN_VERSION_COI }}
            - name: Activate emsdk on PATH
              shell: bash
              run: |
                  set -exo pipefail   # NOT -u: emsdk_env.sh doesn't always set every var
                  source /opt/emsdk/emsdk_env.sh
                  echo "EMSDK=${EMSDK:-/opt/emsdk}" >> "$GITHUB_ENV"
                  echo "EMSDK_NODE=${EMSDK_NODE:-}" >> "$GITHUB_ENV"
                  echo "EM_CONFIG=${EM_CONFIG:-/opt/emsdk/.emscripten}" >> "$GITHUB_ENV"
                  echo "/opt/emsdk"                       >> "$GITHUB_PATH"
                  echo "/opt/emsdk/upstream/emscripten"   >> "$GITHUB_PATH"
                  if [ -n "${EMSDK_NODE:-}" ]; then echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"; fi

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            # Haybarn: httpfs from the fork, at the commit the engine pins, built into the local extension repository,
            # so the loadable suites test the browser HTTP client against an httpfs of the same engine (the published
            # one may have been built against another engine commit)
            - name: Check out httpfs
              run: |
                  ref=$(sed -n 's/^ *GIT_TAG *\([0-9a-f]*\).*/\1/p' submodules/duckdb/.github/config/haybarn/extensions/httpfs.cmake)
                  git clone --filter=blob:none https://github.com/Query-farm-haybarn/haybarn-httpfs "$RUNNER_TEMP/haybarn-httpfs"
                  git -C "$RUNNER_TEMP/haybarn-httpfs" checkout "$ref"
                  echo "DUCKDB_HTTPFS_DIRECTORY=$RUNNER_TEMP/haybarn-httpfs" >> "$GITHUB_ENV"

            - name: Build Wasm module
              run: |
                  HAYBARN_WASM_TEST_EXTENSIONS=1 USE_GENERATED_EXPORTED_LIST="$DEFAULT_USE_GENERATED_EXPORTED_LIST" DUCKDB_PLATFORM="wasm_threads" DUCKDB_WASM_LOADABLE_EXTENSIONS="signed" GEN=ninja ./scripts/wasm_build_lib.sh relsize threads

            - name: Check the wasm name section
              run: |
                  node ./scripts/test_wasm_name_section.cjs ./packages/duckdb-wasm/src/bindings/duckdb-threads.wasm

            - name: Test pthread completion handler
              run: |
                  node ./scripts/test_wasm_pthread_glue.cjs ./packages/duckdb-wasm/src/bindings/duckdb-threads.js

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-threads-loadable
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-threads.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-threads.pthread.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-threads.wasm
                  retention-days: 1

            - name: Upload extension repository
              uses: actions/upload-artifact@v7
              with:
                  name: extension-repository-threads-loadable
                  path: ./build/extension_repository
                  if-no-files-found: error
                  retention-days: 1

