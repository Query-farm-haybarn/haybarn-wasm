name: 'Main'
on:
    push:
    pull_request:
    create:
        tags:
            - haybarn-v*
    workflow_call:
      inputs:
        override_git_describe:
          type: string
        git_ref:
          type: string
        skip_tests:
          type: string
        # Haybarn: opt in to the benchmark suite (micro + TPC-H 0.01..0.5 +
        # merge_reports). Off by default: it adds ~30 min per run.
        run_benchmarks:
          type: boolean
          default: false
    workflow_dispatch:
      inputs:
        override_git_describe:
          type: string
        git_ref:
          type: string
        skip_tests:
          type: string
        # Haybarn: opt in to the benchmark suite (micro + TPC-H 0.01..0.5 +
        # merge_reports). Off by default: it adds ~30 min per run.
        run_benchmarks:
          type: boolean
          default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/haybarn-2.0' || github.sha }}-${{ github.event_name}}
  cancel-in-progress: true

env:
  EMSCRIPTEN_VERSION: '6.0.13'
  EMSCRIPTEN_VERSION_COI: '6.0.13'
  DEFAULT_USE_GENERATED_EXPORTED_LIST: 'no'
  # DuckDB >= v2.0 no longer derives its version from git tags, the wasm builds pick this up instead.
  # Haybarn: always the engine release, so extensions resolve under core/v2.0.0/ on every build.
  OVERRIDE_GIT_DESCRIBE: ${{ inputs.override_git_describe || 'v2.0.0' }}
  # Placeholder npm token. `actions/setup-node` with `registry-url:` writes an .npmrc containing a
  # literal `${NODE_AUTH_TOKEN}`, and yarn 1.x hard-errors ("Failed to replace env in config") if
  # it is unset. The publish step sets the real HAYBARN_NPM_TOKEN at step level.
  NODE_AUTH_TOKEN: 'XXXXX-XXXXX-XXXXX-XXXXX'
  # R2-backed ccache shared with haybarn-extension-ci-tools (same worker, bucket and bearer auth).
  CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
  # sccache for the Rust shell crate when it compiles inside the CI image.
  SCCACHE_WEBDAV_ENDPOINT: "https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/sccache/"
  SCCACHE_WEBDAV_TOKEN: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
  CARGO_INCREMENTAL: 0

jobs:
    # Haybarn: no Clang-Format job, as on 1.5. lib/ follows upstream's formatting and the Haybarn
    # CI image ships a different clang-format than upstream's, which would flag upstream's own code.
    eslint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true

            # Haybarn: the VGI worker: ring stubs of lib/js-stubs.js and their reference model, in Node
            - name: Test the VGI shared-memory host ABI
              run: |
                  node lib/vgi-sab-ring.test.js
                  node lib/vgi-sab-publication.test.js

            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                  path: |
                      ./node_modules
                      ./packages/benchmarks/node_modules
                      ./packages/duckdb-wasm/node_modules
                      ./packages/duckdb-wasm-shell/node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('./yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Prepare repository
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      yarn install --frozen-lockfile --prefer-offline

            - name: Lint @haybarn/haybarn-wasm
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      yarn workspace @haybarn/haybarn-wasm run lint

            - name: Lint @haybarn/haybarn-wasm-shell
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      yarn workspace @haybarn/haybarn-wasm-shell run lint

            - name: Lint @haybarn/benchmarks
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      yarn workspace @haybarn/benchmarks run lint

    tpchgen:
        name: TPCH Generator
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true

            - name: Cache generator
              uses: actions/cache@v5
              id: cache-generator
              with:
                  path: ./submodules/tpch-dbgen/dbgen/dbgen
                  key: ${{ runner.os }}-tpch-dbgen

            - name: Build generator
              if: steps.cache-generator.outputs.cache-hit != 'true'
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      make -C ./submodules/tpch-dbgen/dbgen/ dbgen

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: tpch-dbgen
                  path: |
                      ./submodules/tpch-dbgen/dbgen/dbgen
                  retention-days: 1

    dataprep:
        name: Dataprep
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true

            - name: Cache rust build
              uses: actions/cache@v5
              with:
                  path: |
                      ./.cargo/bin/
                      ./.cargo/registry/index/
                      ./.cargo/registry/cache/
                      ./.cargo/git/db/
                      ./target
                  key: ${{ runner.os }}-dataprep-${{ hashFiles('./Cargo.lock') }}-${{ hashFiles('./tools/dataprep/src/*.rs') }}
                  restore-keys: |
                      ${{ runner.os }}-dataprep-

            - name: Build generator
              shell: bash
              run: |
                      cargo build --manifest-path=./Cargo.toml --release -p dataprep

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dataprep
                  path: |
                      ./target/release/dataprep
                  retention-days: 1

    native_debug:
        name: Native / Debug
        runs-on: ubuntu-latest
        if: false
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true
                  fetch-depth: 0

            - uses: actions/download-artifact@v8
              with:
                  name: dataprep
                  path: ./target/release/

            - uses: actions/download-artifact@v8
              with:
                  name: tpch-dbgen
                  path: ./submodules/tpch-dbgen/dbgen/

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Cache native build
              uses: actions/cache@v5
              with:
                  path: |
                      ./.cargo/bin/
                      ./.cargo/registry/index/
                      ./.cargo/registry/cache/
                      ./.cargo/git/db/
                      ./.ccache
                      ./.emscripten_cache
                  key: ${{ runner.os }}-native2-debug-${{ hashFiles('git_submodule_status.txt') }}-${{ hashFiles('lib/src/**') }}-${{ hashFiles('lib/include/**') }}
                  restore-keys: |
                      ${{ runner.os }}-native2-debug-${{ hashFiles('git_submodule_status.txt') }}
                      ${{ runner.os }}-native2-debug-
                      ${{ runner.os }}-native2-

            - name: Prepare repository
              run: |
                  (cd ./submodules/duckdb && git fetch --all --tags)
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            - name: Prepare environment
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      mkdir -p ./lib/build/debug ./reports
                      ./scripts/generate_tpch_tbl.sh 0.01
                      ./scripts/generate_tpch_arrow.sh 0.01
                      ./scripts/generate_uni.sh
                      ccache --max-size 200M
                      ccache -s

            - name: Build project
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      cmake \
                          -S./lib/ \
                          -B./lib/build/debug \
                          -DCODE_COVERAGE=1 \
                          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                          -DCMAKE_C_COMPILER=clang \
                          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                          -DCMAKE_CXX_COMPILER=clang++ \
                          -DCMAKE_BUILD_TYPE=Debug
                      ccache -z
                      make -C./lib/build/debug -j`nproc` || exit 1
                      ccache -s

            - name: Test project
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      export LLVM_PROFILE_FILE=./reports/lib.profraw
                      ./lib/build/debug/tester \
                          --source_dir=./lib/ \
                          --gtest_output=xml:./reports/tests_lib_debug.xml

            - name: Code Coverage
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      llvm-profdata merge \
                          -sparse ./reports/lib.profraw \
                          -o ./reports/lib.profdata
                      llvm-cov show ./lib/build/debug/tester \
                          --instr-profile ./reports/lib.profdata \
                          -ignore-filename-regex submodules \
                          > ./reports/coverage_lib.txt

    native_release:
        name: Native / Release
        runs-on: ubuntu-latest
        if: false
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true
                  fetch-depth: 0

            - uses: actions/download-artifact@v8
              with:
                  name: dataprep
                  path: ./target/release/

            - uses: actions/download-artifact@v8
              with:
                  name: tpch-dbgen
                  path: ./submodules/tpch-dbgen/dbgen/

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Cache native build
              uses: actions/cache@v5
              with:
                  path: |
                      ./.cargo/bin/
                      ./.cargo/registry/index/
                      ./.cargo/registry/cache/
                      ./.cargo/git/db/
                      ./.ccache
                      ./.emscripten_cache
                  key: ${{ runner.os }}-native2-release-${{ hashFiles('git_submodule_status.txt') }}-${{ hashFiles('lib/src/**') }}-${{ hashFiles('lib/include/**') }}
                  restore-keys: |
                      ${{ runner.os }}-native2-release-${{ hashFiles('git_submodule_status.txt') }}
                      ${{ runner.os }}-native2-release-
                      ${{ runner.os }}-native2-

            - name: Prepare repository
              run: |
                  (cd ./submodules/duckdb && git fetch --all --tags)
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            - name: Prepare environment
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      mkdir -p ./lib/build/release ./reports
                      ./scripts/generate_tpch_tbl.sh 0.01
                      ./scripts/generate_tpch_arrow.sh 0.01
                      ./scripts/generate_uni.sh
                      ccache --max-size 200M
                      ccache -s

            - name: Build project
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      cmake \
                          -S./lib/ \
                          -B./lib/build/release \
                          -DCODE_COVERAGE=1 \
                          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                          -DCMAKE_C_COMPILER=clang \
                          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                          -DCMAKE_CXX_COMPILER=clang++ \
                          -DCMAKE_BUILD_TYPE=Release
                      ccache -z
                      make -C./lib/build/release -j`nproc` || exit 1
                      ccache -s

            - name: Test project
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      export LLVM_PROFILE_FILE=./reports/lib.profraw
                      ./lib/build/release/tester \
                          --source_dir=./lib/ \
                          --gtest_output=xml:./reports/tests_lib_release.xml

            - name: Code Coverage
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      llvm-profdata merge \
                          -sparse ./reports/lib.profraw \
                          -o ./reports/lib.profdata
                      llvm-cov show ./lib/build/release/tester \
                          --instr-profile ./reports/lib.profdata \
                          -ignore-filename-regex submodules \
                          > ./reports/coverage_lib.txt

    wasm_base:
        name: Wasm / base
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            # Install emsdk at the fixed path /opt/emsdk. setup-emsdk installs to a per-run
            # directory, which gets hashed into every ccache entry and defeats cross-run reuse.
            - name: Cache /opt/emsdk
              id: cache-emsdk
              uses: actions/cache@v5
              with:
                  path: /opt/emsdk
                  key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-x86_64-linux
            - name: Install emsdk at /opt/emsdk
              if: steps.cache-emsdk.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euxo pipefail
                  sudo mkdir -p /opt && sudo chown -R "$(id -u):$(id -g)" /opt
                  git clone --depth=1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
                  cd /opt/emsdk
                  ./emsdk install ${{ env.EMSCRIPTEN_VERSION }}
                  ./emsdk activate ${{ env.EMSCRIPTEN_VERSION }}
            - name: Activate emsdk on PATH
              shell: bash
              run: |
                  set -exo pipefail   # NOT -u: emsdk_env.sh doesn't always set every var
                  source /opt/emsdk/emsdk_env.sh
                  echo "EMSDK=${EMSDK:-/opt/emsdk}" >> "$GITHUB_ENV"
                  echo "EMSDK_NODE=${EMSDK_NODE:-}" >> "$GITHUB_ENV"
                  echo "EM_CONFIG=${EM_CONFIG:-/opt/emsdk/.emscripten}" >> "$GITHUB_ENV"
                  echo "/opt/emsdk"                       >> "$GITHUB_PATH"
                  echo "/opt/emsdk/upstream/emscripten"   >> "$GITHUB_PATH"
                  if [ -n "${EMSDK_NODE:-}" ]; then echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"; fi

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  DUCKDB_PLATFORM="wasm_eh" ./scripts/wasm_build_lib.sh relperf base

            - name: Check the wasm name section
              run: |
                  node ./scripts/test_wasm_name_section.cjs ./packages/duckdb-wasm/src/bindings/duckdb-base.wasm

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-base
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-base.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-base.wasm
                  retention-days: 1

    wasm_threads:
        name: Wasm / threads
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            # Install emsdk at the fixed path /opt/emsdk. setup-emsdk installs to a per-run
            # directory, which gets hashed into every ccache entry and defeats cross-run reuse.
            - name: Cache /opt/emsdk
              id: cache-emsdk
              uses: actions/cache@v5
              with:
                  path: /opt/emsdk
                  key: emsdk-${{ env.EMSCRIPTEN_VERSION_COI }}-x86_64-linux
            - name: Install emsdk at /opt/emsdk
              if: steps.cache-emsdk.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euxo pipefail
                  sudo mkdir -p /opt && sudo chown -R "$(id -u):$(id -g)" /opt
                  git clone --depth=1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
                  cd /opt/emsdk
                  ./emsdk install ${{ env.EMSCRIPTEN_VERSION_COI }}
                  ./emsdk activate ${{ env.EMSCRIPTEN_VERSION_COI }}
            - name: Activate emsdk on PATH
              shell: bash
              run: |
                  set -exo pipefail   # NOT -u: emsdk_env.sh doesn't always set every var
                  source /opt/emsdk/emsdk_env.sh
                  echo "EMSDK=${EMSDK:-/opt/emsdk}" >> "$GITHUB_ENV"
                  echo "EMSDK_NODE=${EMSDK_NODE:-}" >> "$GITHUB_ENV"
                  echo "EM_CONFIG=${EM_CONFIG:-/opt/emsdk/.emscripten}" >> "$GITHUB_ENV"
                  echo "/opt/emsdk"                       >> "$GITHUB_PATH"
                  echo "/opt/emsdk/upstream/emscripten"   >> "$GITHUB_PATH"
                  if [ -n "${EMSDK_NODE:-}" ]; then echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"; fi

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Build Wasm module
              run: |
                  DUCKDB_PLATFORM="wasm_threads" ./scripts/wasm_build_lib.sh relperf threads

            - name: Check the wasm name section
              run: |
                  node ./scripts/test_wasm_name_section.cjs ./packages/duckdb-wasm/src/bindings/duckdb-threads.wasm

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-threads
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-threads.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-threads.pthread.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-threads.wasm
                  retention-days: 1

    wasm_base_loadable:
        name: Wasm / base (loadable version)
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Install dependencies
              run: |
                  sudo apt install wabt

            - name: Prepare repository
              run: |
                  make apply_patches
                  cd submodules/duckdb && git tag ${{ inputs.override_git_describe }}

            # Install emsdk at the fixed path /opt/emsdk. setup-emsdk installs to a per-run
            # directory, which gets hashed into every ccache entry and defeats cross-run reuse.
            - name: Cache /opt/emsdk
              id: cache-emsdk
              uses: actions/cache@v5
              with:
                  path: /opt/emsdk
                  key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-x86_64-linux
            - name: Install emsdk at /opt/emsdk
              if: steps.cache-emsdk.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euxo pipefail
                  sudo mkdir -p /opt && sudo chown -R "$(id -u):$(id -g)" /opt
                  git clone --depth=1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
                  cd /opt/emsdk
                  ./emsdk install ${{ env.EMSCRIPTEN_VERSION }}
                  ./emsdk activate ${{ env.EMSCRIPTEN_VERSION }}
            - name: Activate emsdk on PATH
              shell: bash
              run: |
                  set -exo pipefail   # NOT -u: emsdk_env.sh doesn't always set every var
                  source /opt/emsdk/emsdk_env.sh
                  echo "EMSDK=${EMSDK:-/opt/emsdk}" >> "$GITHUB_ENV"
                  echo "EMSDK_NODE=${EMSDK_NODE:-}" >> "$GITHUB_ENV"
                  echo "EM_CONFIG=${EM_CONFIG:-/opt/emsdk/.emscripten}" >> "$GITHUB_ENV"
                  echo "/opt/emsdk"                       >> "$GITHUB_PATH"
                  echo "/opt/emsdk/upstream/emscripten"   >> "$GITHUB_PATH"
                  if [ -n "${EMSDK_NODE:-}" ]; then echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"; fi

            - name: Setup Ccache
              uses: hendrikmuhs/ccache-action@main
              with:
                  key: ${{ github.job }}

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            # Haybarn: httpfs from the fork, at the commit the engine pins, built into the local extension repository,
            # so the loadable suites test the browser HTTP client against an httpfs of the same engine (the published
            # one may have been built against another engine commit)
            - name: Check out httpfs
              run: |
                  ref=$(sed -n 's/^ *GIT_TAG *\([0-9a-f]*\).*/\1/p' submodules/duckdb/.github/config/haybarn/extensions/httpfs.cmake)
                  git clone --filter=blob:none https://github.com/Query-farm-haybarn/haybarn-httpfs "$RUNNER_TEMP/haybarn-httpfs"
                  git -C "$RUNNER_TEMP/haybarn-httpfs" checkout "$ref"
                  echo "DUCKDB_HTTPFS_DIRECTORY=$RUNNER_TEMP/haybarn-httpfs" >> "$GITHUB_ENV"

            # Haybarn: HAYBARN_WASM_TEST_EXTENSIONS adds the test extension of the platform functions to the local
            # repository (extension_config_wasm.cmake), for test:chrome:platform
            - name: Build Wasm module
              run: |
                  HAYBARN_WASM_TEST_EXTENSIONS=1 USE_GENERATED_EXPORTED_LIST="$DEFAULT_USE_GENERATED_EXPORTED_LIST" DUCKDB_PLATFORM="wasm_eh" DUCKDB_WASM_LOADABLE_EXTENSIONS=1 GEN=ninja ./scripts/wasm_build_lib.sh relsize base

            - name: Check the wasm name section
              run: |
                  node ./scripts/test_wasm_name_section.cjs ./packages/duckdb-wasm/src/bindings/duckdb-base.wasm

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wasm-base-loadable
                  path: |
                      ./packages/duckdb-wasm/src/bindings/duckdb-base.js
                      ./packages/duckdb-wasm/src/bindings/duckdb-base.wasm
                  retention-days: 1

            - name: Upload extension repository
              uses: actions/upload-artifact@v7
              with:
                  name: extension-repository-base-loadable
                  path: ./build/extension_repository
                  if-no-files-found: error
                  retention-days: 1

    wasm_threads_loadable:
        name: Wasm / threads (loadable version)
        runs-on: ubuntu-latest
        needs:
            - dataprep
            - tpchgen
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Install dependencies
              run: |
                  sudo apt install wabt

            - name: Prepare repository
