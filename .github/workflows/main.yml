                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - name: Git submodule status
              run: |
                  git submodule status > git_submodule_status.txt

            - name: Cache rust build
              uses: actions/cache@v6
              with:
                  path: |
                      ./.cargo/bin/
                      ./.cargo/registry/index/
                      ./.cargo/registry/cache/
                      ./.cargo/git/db/
                      ./target
                  key: ${{ runner.os }}-shell-${{ hashFiles('./Cargo.lock') }}-${{ hashFiles('./packages/duckdb-wasm-shell/crate/src/**') }}
                  restore-keys: |
                      ${{ runner.os }}-shell-

            - name: Cache node_modules
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./packages/benchmarks/node_modules
                      ./packages/duckdb-wasm/node_modules
                      ./packages/duckdb-wasm-shell/node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('./yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - uses: actions/download-artifact@v8
              with:
                  name: dataprep
                  path: ./target/release/

            - uses: actions/download-artifact@v8
              with:
                  name: tpch-dbgen
                  path: ./submodules/tpch-dbgen/dbgen/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-mvp-loadable
                  path: ./packages/duckdb-wasm/src/bindings/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-eh-loadable
                  path: ./packages/duckdb-wasm/src/bindings/

            - uses: actions/download-artifact@v8
              with:
                  name: wasm-coi-loadable
                  path: ./packages/duckdb-wasm/src/bindings/

            - name: Prepare repository
              run: |
                  git fetch --tags --no-recurse-submodules -f
                  (cd ./submodules/duckdb && git fetch --all --tags)

            - name: Prepare environment
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      git config --global --add safe.directory '*'
                      mkdir -p ./lib/build/wasm/release ./reports
                      yarn install --frozen-lockfile
                      ./scripts/generate_tpch_tbl.sh 0.01
                      ./scripts/generate_tpch_arrow.sh 0.01
                      ./scripts/generate_uni.sh
                      ./scripts/npm_version.sh

            - name: Build @haybarn/haybarn-wasm
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm/dist/
                      yarn workspace @haybarn/haybarn-wasm build:release
                      yarn workspace @haybarn/haybarn-wasm docs

            - name: Build @haybarn/haybarn-wasm-shell
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm-shell/dist/
                      yarn workspace @haybarn/haybarn-wasm-shell install:wasmpack
                      yarn workspace @haybarn/haybarn-wasm-shell build:release

            - name: Build @haybarn/haybarn-wasm-app
              shell: bash
              run: |
                      rm -rf ./packages/duckdb-wasm-app/build/
                      yarn workspace @haybarn/haybarn-wasm-app build:release

            # Publish the COI engine wasm to Haybarn R2 (served at
            # haybarn-extensions.query.farm) under a version-pinned key, so the
            # shell's _worker.js streams it from our own R2 instead of jsDelivr.
            # Decouples shell deploys from jsDelivr's npm-mirror lag (which can
            # 502 a fresh release until jsDelivr catches up). Same R2 creds /
            # endpoint as the engine repo's extension publish (org-level
            # secrets). Versioned path => safely immutable per release.
            - name: Publish COI wasm to R2
              if: github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && startsWith(github.ref, 'refs/tags/haybarn-v'))
              env:
                  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
                  AWS_DEFAULT_REGION: auto
                  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
                  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
              run: |
                  # Derive the version from the worker's own URL, NOT package.json:
                  # CI rewrites package.json to a dev version (e.g. 1.5.2-dev1.0) on
                  # workflow_dispatch, which would upload to a path the (hardcoded,
                  # rc-pinned) worker never fetches. The worker URL is the single
                  # source of truth for the path the shell will request.
                  VERSION=$(grep -oE 'engine/[^/]+/duckdb-coi\.wasm' packages/duckdb-wasm-app/_worker.js | head -1 | sed -E 's|engine/(.+)/duckdb-coi\.wasm|\1|')
                  test -n "$VERSION" || { echo "could not parse engine version from _worker.js"; exit 1; }
                  WASM=./packages/duckdb-wasm/src/bindings/duckdb-coi.wasm
                  test -f "$WASM" || { echo "missing $WASM"; exit 1; }
                  echo "Uploading $WASM -> s3://${{ secrets.R2_BUCKET }}/engine/${VERSION}/duckdb-coi.wasm"
                  aws s3 cp "$WASM" "s3://${{ secrets.R2_BUCKET }}/engine/${VERSION}/duckdb-coi.wasm" \
                      --content-type application/wasm \
                      --cache-control "public, max-age=31536000, immutable"

            #- name: Coverage @haybarn/haybarn-wasm
            #  shell: bash
            #  run: |
            #           CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome:coverage

            - name: Package
              shell: bash
              run: zip -r duckdb-wasm-packages.zip ./packages

            - name: Measure NPM stats
              run: |
                  ./scripts/npm_measure_lib.sh

            - name: Test @haybarn/haybarn-wasm on Chrome
              shell: bash
              run: |
                      CHROME_BIN=`which google-chrome` yarn workspace @haybarn/haybarn-wasm test:chrome
            
            #            - name: Test @haybarn/haybarn-wasm on Firefox
            #              uses: ./.github/actions/haybarn-wasm-ci-env
            #              with:
            #                  script: |-
            #                      yarn workspace @haybarn/haybarn-wasm test:firefox

            - name: Test @haybarn/haybarn-wasm on Node.js
              shell: bash
              run: |
                      yarn workspace @haybarn/haybarn-wasm test:node

            # Publish @haybarn/haybarn-wasm to npm. Only on `haybarn-v*` tag
            # creation — we don't continuously publish from the `haybarn`
            # branch (too noisy for a derived distribution).
            #
            # Auth: NODE_AUTH_TOKEN from the org-level HAYBARN_NPM_TOKEN
            # secret (same pattern haybarn-extension-ci-tools uses). The
            # publish still attaches OIDC provenance via the workflow's
            # `id-token: write` permission, even though the auth itself is
            # token-based — they're independent.
            #
            # The other workspace packages (-shell, -app, react-haybarn,
            # benchmarks) are private:true and never published.
            - name: Publish @haybarn/haybarn-wasm to npm
              env:
                  TAG: 'latest'
                  NODE_AUTH_TOKEN: ${{ secrets.HAYBARN_NPM_TOKEN }}
              if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/haybarn-v')
              run: |
                  echo "TAG=${TAG} ref=${GITHUB_REF}"
                  ./scripts/npm_publish_lib.sh

            # Deploy the rebranded Haybarn shell to Cloudflare Pages
            # (shell.haybarn.query.farm). The COI wasm is streamed same-origin by
            # _worker.js from Haybarn R2 (uploaded earlier). `--branch
            # production` targets the project's production deployment (the one the
            # custom domain serves). Runs on manual dispatch or on a haybarn-v* tag.
            #
            # Deliberately ordered AFTER the npm publish. This step used to sit
            # before it, so when wrangler rejected the account ID during
            # 1.5.5-rc1 the job aborted and skipped the publish entirely — a
            # cosmetic shell deploy took down the actual package release. The
            # shell is downstream of the package, so publishing first is also
            # the correct dependency order.
            #
            # wrangler is pinned rather than `@latest`: 4.112.0 deployed
            # 1.5.4-rc3 fine, then 4.119.0 shipped stricter account-ID
            # validation and broke the 1.5.5-rc1 release with no change on our
            # side. 4.119.0 is the version that has since been verified green.
            - name: Deploy Haybarn shell to Cloudflare Pages
              if: github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && startsWith(github.ref, 'refs/tags/haybarn-v'))
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  # Strip stray whitespace from the secret — wrangler >= 4.119
                  # rejects an account ID containing anything outside
                  # [A-Za-z0-9_-], and a trailing newline in the stored secret
                  # is invisible in the UI.
                  export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '[:space:]')"
                  npx --yes wrangler@4.119.0 pages deploy \
                      packages/duckdb-wasm-app/build/release \
                      --project-name haybarn-shell \
                      --branch production

    merge_reports:
        name: Merge benchmark reports
        runs-on: ubuntu-latest
        if: inputs.run_benchmarks
        needs:
            - js_libs
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: 'recursive'

            - uses: actions/download-artifact@v8
              with:
                  name: dataprep
                  path: ./target/release/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_micro
                  path: ./reports/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_tpch_0_01
                  path: ./reports/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_tpch_0_1
                  path: ./reports/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_tpch_0_25
                  path: ./reports/

            - uses: actions/download-artifact@v8
              with:
                  name: reports_tpch_0_5
                  path: ./reports/

            - name: Merge reports
              shell: bash
              run: |
                mkdir duckdb
                cd duckdb
                wget https://github.com/duckdb/duckdb/releases/download/v0.8.1/duckdb_cli-linux-amd64.zip
                unzip duckdb_cli-linux-amd64.zip
                ./duckdb -c "COPY (FROM read_json_auto('../reports/*.json', union_by_name=1)) TO 'benchmarks.json'"
                ./duckdb -c "COPY (FROM read_json_auto('../reports/*.json', union_by_name=1)) TO 'benchmarks.csv'"

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: reports_various
                  path: |
                      ./reports/benchmarks.arrow
                      ./duckdb/benchmarks.json
                      ./duckdb/benchmarks.csv
                  retention-days: 1

            - name: Merge benchmark reports
              uses: ./.github/actions/haybarn-wasm-ci-env
              with:
                  script: |-
                      chmod +x ./target/release/dataprep
                      ./target/release/dataprep merge-benchmarks -r ./reports/

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: reports_all
                  path: |
                      ./reports/benchmarks.arrow
                  retention-days: 1

            # Benchmark report publish disabled for the initial release —
            # same reason as the Pages deploy above (no gh-pages branch).
            - name: Deploy benchmark reports
              if: false
              run: |
                  git config --global user.name 'github-actions[bot]'
                  git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
                  git fetch origin gh-pages
                  ./scripts/deploy_benchmarks.sh
