<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>duckdb-wasm async/COI startup profile</title>
<script type="importmap">
{ "imports": { "apache-arrow": "https://esm.sh/apache-arrow@17.0.0" } }
</script>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
const N_QUERIES = 5;
const tag = {};
function mark(name) { tag[name] = performance.now(); }
function span(a, b) { return +(tag[b] - tag[a]).toFixed(1); }

try {
  mark('t0_module_eval');
  const duckdb = await import('./duckdb-browser.mjs');
  mark('t1_module_loaded');

  const BUNDLES = {
    mvp: { mainModule: './duckdb-mvp.wasm', mainWorker: './duckdb-browser-mvp.worker.js' },
    eh:  { mainModule: './duckdb-eh.wasm',  mainWorker: './duckdb-browser-eh.worker.js'  },
    coi: { mainModule: './duckdb-coi.wasm', mainWorker: './duckdb-browser-coi.worker.js',
           pthreadWorker: './duckdb-browser-coi.pthread.worker.js' },
  };
  mark('t2_bundles_defined');

  const cfg = await duckdb.selectBundle(BUNDLES);
  mark('t3_bundle_selected');

  const worker = new Worker(cfg.mainWorker);
  const logger = new duckdb.ConsoleLogger();
  const db = new duckdb.AsyncDuckDB(logger, worker);
  mark('t4_db_constructed');

  await db.instantiate(cfg.mainModule, cfg.pthreadWorker);
  mark('t5_db_instantiated');

  const conn = await db.connect();
  mark('t6_connected');

  const queryTimes = [];
  for (let i = 0; i < N_QUERIES; i++) {
    const s = performance.now();
    await conn.query(`SELECT count(*)::INTEGER AS v FROM generate_series(0, 100) t(v)`);
    queryTimes.push(performance.now() - s);
  }
  mark('t7_queries_done');

  await conn.close();
  await db.terminate();
  await worker.terminate();

  const cold_q = +queryTimes[0].toFixed(1);
  const warm_q = +(queryTimes.slice(1).reduce((a,b)=>a+b,0)/(queryTimes.length-1)).toFixed(1);
  const result = {
    selected_bundle: cfg.mainModule,
    crossOriginIsolated: window.crossOriginIsolated,
    sab_available: typeof SharedArrayBuffer !== 'undefined',
    phases: {
      'module-eval-import':              span('t0_module_eval',  't1_module_loaded'),
      'bundle-define':                   span('t1_module_loaded','t2_bundles_defined'),
      'selectBundle (feature-detect)':   span('t2_bundles_defined','t3_bundle_selected'),
      'worker+db-construct':             span('t3_bundle_selected','t4_db_constructed'),
      'db.instantiate (fetch+compile+init)': span('t4_db_constructed','t5_db_instantiated'),
      'first-connect':                   span('t5_db_instantiated','t6_connected'),
      'cold-query-ms':                   cold_q,
      'warm-queries-avg-ms':             warm_q,
      'total-import-to-ready':           span('t0_module_eval',  't6_connected'),
      'total-import-to-first-result':    +(span('t0_module_eval', 't6_connected') + cold_q).toFixed(1),
    },
    all_query_times: queryTimes.map(x => +x.toFixed(1)),
  };
  document.getElementById('out').textContent = JSON.stringify(result, null, 2);
  window.__PROFILE_RESULT__ = result;
} catch (e) {
  document.getElementById('out').textContent = 'ERROR: ' + e.stack;
  window.__PROFILE_ERROR__ = e.stack;
}
</script>
</body>
</html>
